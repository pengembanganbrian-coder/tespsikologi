<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC DJBC 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f7f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .container { max-width: 900px; margin-top: 30px; margin-bottom: 50px; }
        .header-djbc { background-color: #002855; color: white; padding: 25px; text-align: center; border-radius: 8px 8px 0 0; }
        .identitas-box { background: white; padding: 25px; border: 1px solid #ccc; border-top: none; margin-bottom: 20px; }
        
        .disc-table { width: 100%; background: white; border-collapse: collapse; margin-bottom: 25px; border: 2px solid #333; }
        .disc-table th { background-color: #d9e1f2; padding: 10px; border: 1px solid #333; text-align: center; font-weight: bold; }
        .disc-table td { padding: 12px; border: 1px solid #333; vertical-align: middle; text-align: center; }
        
        .col-m { width: 60px; background-color: #e2f0d9; }
        .col-l { width: 60px; background-color: #fbe5d6; }
        .col-text { text-align: center !important; font-weight: 500; color: #333; }

        input[type="radio"] { transform: scale(1.6); cursor: pointer; }
        .btn-submit { background-color: #002855; color: white; padding: 15px 60px; font-weight: bold; border: none; border-radius: 4px; font-size: 1.1rem; }
        .btn-submit:hover { background-color: #001a38; }
        
        #resultArea { display: none; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .report-section { margin-top: 30px; border-top: 3px solid #002855; padding-top: 25px; }
        .report-title { color: #002855; font-weight: bold; font-size: 1.4rem; margin-bottom: 20px; text-transform: uppercase; }
        .chart-container { position: relative; height: 350px; margin: 0 auto 40px auto; padding: 20px; background: #fff; border: 1px solid #eee; }
        
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div id="quizArea">
        <div class="header-djbc">
            <h1 class="mb-0">DISC DJBC 2026</h1>
        </div>
        
        <div class="identitas-box shadow-sm">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label fw-bold">Nama Pegawai</label><input type="text" id="nama" class="form-control" placeholder="Nama Lengkap"></div>
                <div class="col-md-4"><label class="form-label fw-bold">NIP</label><input type="text" id="nip" class="form-control" placeholder="Nomor Induk Pegawai"></div>
                <div class="col-md-4"><label class="form-label fw-bold">Jabatan</label><input type="text" id="jabatan" class="form-control" placeholder="Jabatan Saat Ini"></div>
            </div>
        </div>

        <form id="discForm">
            <div id="soalContainer"></div>
            <div class="text-center mt-4">
                <button type="button" class="btn btn-submit shadow" onclick="prosesSkoring()">TAMPILKAN HASIL ANALISIS</button>
            </div>
        </form>
    </div>

    <div id="resultArea">
        <h2 class="text-center mb-5 fw-bold">LAPORAN PROFIL PSIKOLOGI DISC</h2>
        
        <div class="chart-container">
            <canvas id="discLineChart"></canvas>
        </div>

        <div id="detailUraian"></div>

        <div class="text-center mt-5 no-print">
            <button class="btn btn-primary px-5 me-2" onclick="window.print()">CETAK LAPORAN</button>
            <button class="btn btn-outline-secondary px-5" onclick="location.reload()">TES ULANG</button>
        </div>
    </div>
</div>

<script>
    const listSoal = [
        {id:1, opt:[{t:"Suka berpetualangan, pengambil Resiko", v:"D"}, {t:"Mudah bergaul, menyenangkan", v:"I"}, {t:"Penuh toleransi, menghormati orang lain", v:"S"}, {t:"Mudah percaya kepada orang lain", v:"S"}]},
        {id:2, opt:[{t:"Berbicara lembut, pendiam", v:"C"}, {t:"Optimis, berpikir positif", v:"I"}, {t:"Pusat perhatian", v:"I"}, {t:"Lakukan dengan benar, ketepatan penting", v:"C"}]},
        {id:3, opt:[{t:"Buatlah sesuatu menjadi menyenangkan", v:"I"}, {t:"Mari lakukan bersama-sama", v:"S"}, {t:"Tidak tergantung orang lain", v:"D"}, {t:"Hasil adalah segalanya", v:"D"}]},
        {id:4, opt:[{t:"Akan membeli mengikuti dorongan hati", v:"I"}, {t:"Akan menunggu dengan sabar", v:"S"}, {t:"Akan mengeluarkan uang untuk hal diinginkan", v:"D"}, {t:"Pendidikan, budaya", v:"C"}]},
        {id:5, opt:[{t:"Prestasi, penghargaan", v:"D"}, {t:"Keselamatan, keamanan", v:"S"}, {t:"Bergaul, berkumpul dengan kelompok", v:"I"}, {t:"Memimpin, bicara langsung", v:"D"}]},
        {id:6, opt:[{t:"Terbuka, antusias, bersemangat", v:"I"}, {t:"Mudah diduga, konsisten", v:"S"}, {t:"Berhati-hati", v:"C"}, {t:"Pendamai, pembawa keharmonisan", v:"S"}]},
        {id:7, opt:[{t:"Memberikan dorongan kepada orang lain", v:"I"}, {t:"Ramah, mudah berteman", v:"I"}, {t:"Berusaha untuk selalu sempurna", v:"C"}, {t:"Menjadi bagian dari sebuah kelompok", v:"S"}]},
        {id:8, opt:[{t:"Ingin menetapkan tujuan", v:"D"}, {t:"Unik, mudah bosan terhadap rutinitas", v:"I"}, {t:"Aktif mengubah sesuatu", v:"D"}, {t:"Ingin segala sesuatu tepat", v:"C"}]},
        {id:9, opt:[{t:"Mudah menjadi frustasi", v:"D"}, {t:"Tidak melawan, mengalah", v:"S"}, {t:"Memendam perasaan, tertutup", v:"C"}, {t:"Menyampaikan pendapatnya, terbuka", v:"I"}]},
        {id:10, opt:[{t:"Berani menghadapi pihak oposisi", v:"D"}, {t:"Menyukai hal rinci/detil", v:"C"}, {t:"Penuh semangat, banyak bicara", v:"I"}, {t:"Bertindak cepat, tegas", v:"D"}]},
        {id:11, opt:[{t:"Mencoba untuk menjaga kedamaian", v:"S"}, {t:"Mencoba untuk mengikuti aturan", v:"C"}, {t:"Mengatur waktu dengan baik", v:"C"}, {t:"Seringkali terburu-buru, merasa tertekan", v:"D"}]},
        {id:12, opt:[{t:"Berhubungan dengan orang lain itu penting", v:"I"}, {t:"Tenang, suka menyendiri", v:"S"}, {t:"Gembira, periang", v:"I"}, {t:"Menyenangkan, ramah", v:"I"}]},
        {id:13, opt:[{t:"Senang menyelesaikan hal yang telah dimulai", v:"S"}, {t:"Tegas, berani", v:"D"}, {t:"Menolak perubahan yang mendadak", v:"S"}, {t:"Cenderung terlalu banyak berjanji", v:"I"}]},
        {id:14, opt:[{t:"Menarik diri ketika dibawah tekanan", v:"C"}, {t:"Menghabiskan waktu dengan orang lain", v:"I"}, {t:"Mencari tantangan baru", v:"D"}, {t:"Tidak takut konfrontasi langsung", v:"D"}]},
        {id:15, opt:[{t:"Pendorong, pemberi semangat yang baik", v:"I"}, {t:"Pendengar yang baik", v:"S"}, {t:"Penganalisis yang baik", v:"C"}, {t:"Pendelegasi yang baik", v:"D"}]},
        {id:16, opt:[{t:"Merencanakan masa depan, penuh persiapan", v:"C"}, {t:"Menerima penghargaan atas tujuan", v:"D"}, {t:"Peraturan perlu diuji", v:"D"}, {t:"Peraturan membuat adil", v:"C"}]},
        {id:17, opt:[{t:"Peraturan membuat bosan", v:"I"}, {t:"Peraturan membuat aman", v:"S"}, {t:"Berubah di saat-saat terakhir", v:"I"}, {t:"Penuntut, kasar", v:"D"}]},
        {id:18, opt:[{t:"Ingin maju", v:"D"}, {t:"Puas dengan apa yang ada", v:"S"}, {t:"Terbuka mengungkapkan perasaan", v:"I"}, {t:"Rendah hati, sederhana", v:"S"}]},
        {id:19, opt:[{t:"Tidak mudah dikalahkan", v:"D"}, {t:"Mengikuti keinginan pemimpin", v:"S"}, {t:"Bersemangat, periang", v:"I"}, {t:"Ingin teratur, rapi", v:"C"}]},
        {id:20, opt:[{t:"Saya akan memimpin orang lain", v:"D"}, {t:"Saya akan melaksanakannya", v:"S"}, {t:"Saya akan meyakinkan orang lain", v:"I"}, {t:"Saya akan mendapatkan fakta", v:"C"}]},
        {id:21, opt:[{t:"Mendahulukan kepentingan orang lain", v:"S"}, {t:"Suka bersaing, suka tantangan", v:"D"}, {t:"Optimis, berpikir positif", v:"I"}, {t:"Berpikir logis, sistematis", v:"C"}]},
        {id:22, opt:[{t:"Menyenangkan orang, mudah setuju", v:"S"}, {t:"Tertawa dengan keras, hidup", v:"I"}, {t:"Berani, tegas", v:"D"}, {t:"Pendiam/suka menyendiri", v:"C"}]},
        {id:23, opt:[{t:"Menginginkan otoritas yang lebih", v:"D"}, {t:"Menginginkan kesempatan baru", v:"I"}, {t:"Menghindari konflik", v:"S"}, {t:"Menginginkan arahan yang jelas", v:"C"}]},
        {id:24, opt:[{t:"Dapat dipercaya/diandalkan", v:"S"}, {t:"Kreatif, unik", v:"I"}, {t:"Berorientasi pada hasil", v:"D"}, {t:"Memegang standar tinggi, teliti", v:"C"}]}
    ];

    function renderTable() {
        const div = document.getElementById('soalContainer');
        listSoal.forEach((s, idx) => {
            div.innerHTML += `
            <table class="disc-table">
                <thead><tr><th class="col-m">M</th><th class="col-text">PERNYATAAN</th><th class="col-l">L</th></tr></thead>
                <tbody>
                    ${s.opt.map((o, i) => `
                    <tr>
                        <td class="col-m"><input type="radio" name="m${idx}" value="${o.v}" required></td>
                        <td class="col-text">${o.t}</td>
                        <td class="col-l"><input type="radio" name="l${idx}" value="${o.v}" required></td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
        });
    }

    function prosesSkoring() {
        let scores = { D: 0, I: 0, S: 0, C: 0 };
        for(let i=0; i<24; i++) {
            let m = document.querySelector(`input[name="m${i}"]:checked`);
            let l = document.querySelector(`input[name="l${i}"]:checked`);
            if(!m || !l) return alert("Selesaikan semua pilihan di Kotak " + (i+1));
            if(m.parentElement.parentElement === l.parentElement.parentElement) return alert("Baris M & L tidak boleh sama pada satu pernyataan.");
            scores[m.value]++;
            scores[l.value]--; 
        }
        showReport(scores);
    }

    function showReport(data) {
        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';

        new Chart(document.getElementById('discLineChart'), {
            type: 'line',
            data: {
                labels: ['D', 'I', 'S', 'C'],
                datasets: [{
                    label: 'Garis Profil DISC',
                    data: [data.D, data.I, data.S, data.C],
                    borderColor: '#002855',
                    backgroundColor: '#002855',
                    borderWidth: 4,
                    pointRadius: 8,
                    pointBackgroundColor: '#fff',
                    fill: false,
                    tension: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { min: -24, max: 24, grid: { color: '#ddd' } } }
            }
        });

        const max = Object.keys(data).reduce((a, b) => data[a] > data[b] ? a : b);
        const profil = {
            'D': { judul: 'DOMINANCE (D)', karakter: 'Mandiri, tegas, berorientasi hasil, menyukai tantangan dan kontrol.', tampilan: 'Percaya diri, lugas, terkadang terlihat terburu-buru.', perilaku: 'Bekerja cepat, fokus pada target objektif, menyukai efisiensi.', emosi: 'Mudah terpancing rasa tidak sabar jika proses melambat.', kekuatan: 'Keputusan cepat, visi kuat, determinasi tinggi dalam memimpin.', kelemahan: 'Bisa mengabaikan perasaan orang lain, cenderung mendominasi.', kepemimpinan: 'Otokratis dan mengarahkan.', pekerjaan: 'Penegakan hukum, Audit, Penyidikan, Manajerial.' },
            'I': { judul: 'INFLUENCE (I)', karakter: 'Antusias, persuasif, optimis, sangat sosial dan komunikatif.', tampilan: 'Ramah, penuh energi, ekspresif dalam bicara.', perilaku: 'Bekerja melalui kolaborasi, menyukai pengakuan sosial.', emosi: 'Optimisme berlebih, takut akan penolakan.', kekuatan: 'Membangun jaringan, negosiator ulung, motivator tim.', kelemahan: 'Kurang detail, sulit mengatur waktu secara presisi.', kepemimpinan: 'Partisipatif dan karismatik.', pekerjaan: 'Humas, Penyuluhan, Pelayanan Publik, Negosiasi.' },
            'S': { judul: 'STEADINESS (S)', karakter: 'Sabar, setia, pendengar yang baik, menyukai harmoni.', tampilan: 'Tenang, sopan, stabil, tidak banyak menuntut.', perilaku: 'Bekerja secara metodis, fokus pada proses dan loyalitas.', emosi: 'Tidak menonjolkan emosi, takut akan perubahan mendadak.', kekuatan: 'Konsisten, tim player yang andal, pereda konflik.', kelemahan: 'Sulit berkata tidak, lambat dalam perubahan radikal.', kepemimpinan: 'Suportif dan melayani.', pekerjaan: 'Administrasi, Manajemen Data, Staf Internal.' },
            'C': { judul: 'COMPLIANCE (C)', karakter: 'Teliti, logis, analitis, menjunjung tinggi akurasi.', tampilan: 'Formal, serius, berhati-hati, detail-oriented.', perilaku: 'Bekerja berdasarkan fakta dan data, mematuhi SOP.', emosi: 'Takut akan kritik terhadap kualitas hasil kerjanya.', kekuatan: 'Akurasi tinggi, perencanaan matang, integritas standar.', kelemahan: 'Perfeksionis kaku, sering terjebak dalam detail.', kepemimpinan: 'Berbasis standar dan pengawasan kualitas.', pekerjaan: 'Analis Data, Pengawasan Keuangan, Legal/Hukum.' }
        };

        const r = profil[max];
        document.getElementById('detailUraian').innerHTML = `
            <div class="report-section">
                <div class="report-title">Profil Dominan: ${r.judul}</div>
                <div class="row g-4">
                    <div class="col-md-6">
                        <p class="mb-3"><strong>Karakteristik Umum:</strong><br>${r.karakter}</p>
                        <p class="mb-3"><strong>Tampilan Kerja:</strong><br>${r.tampilan}</p>
                        <p class="mb-3"><strong>Perilaku Kerja:</strong><br>${r.perilaku}</p>
                        <p class="mb-3"><strong>Suasana Emosi:</strong><br>${r.emosi}</p>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-3"><strong>Kekuatan:</strong><br>${r.kekuatan}</p>
                        <p class="mb-3"><strong>Kelemahan:</strong><br>${r.kelemahan}</p>
                        <p class="mb-3"><strong>Gaya Kepemimpinan:</strong><br>${r.kepemimpinan}</p>
                        <p class="mb-3"><strong>Karakteristik Pekerjaan Sesuai:</strong><br>${r.pekerjaan}</p>
                    </div>
                </div>
            </div>
        `;
    }
    renderTable();
</script>
</body>
</html>
