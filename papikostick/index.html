<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tes PAPI Kostick - Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @media print { .no-print { display: none; } }
        input[type="radio"]:checked + span { font-weight: bold; color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div class="max-w-5xl mx-auto my-8 bg-white shadow-2xl rounded-2xl overflow-hidden">
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-3xl font-bold uppercase tracking-wide">PAPI KOSTICK TEST</h1>
            <p class="opacity-80">Perception and Preference Inventory</p>
        </div>

        <div class="p-8 border-b bg-white">
            <h2 class="text-xl font-semibold mb-4 text-indigo-700">Identitas Peserta</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" class="w-full border p-2 rounded-md outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">NIP / Nomor Induk</label>
                    <input type="text" id="nip" class="w-full border p-2 rounded-md outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Jabatan</label>
                    <input type="text" id="jabatan" class="w-full border p-2 rounded-md outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Tanggal Tes</label>
                    <input type="date" id="tanggal" class="w-full border p-2 rounded-md outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>

        <div id="quiz-form" class="p-8 space-y-6"></div>

        <div class="p-8 bg-slate-50 text-center no-print border-t">
            <button onclick="kalkulasiHasil()" class="bg-indigo-600 text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-indigo-700 shadow-lg">
                Selesai & Lihat Hasil
            </button>
        </div>

        <div id="hasil-container" class="hidden p-8 border-t-4 border-indigo-600 bg-white">
            <h2 class="text-2xl font-bold text-center mb-8 text-indigo-800">HASIL ANALISIS PROFIL</h2>
            
            <div class="flex flex-col lg:flex-row items-center gap-10">
                <div class="w-full lg:w-1/2 flex justify-center">
                    <canvas id="papiChart"></canvas>
                </div>
                <div class="w-full lg:w-1/2">
                    <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 text-center" id="skor-box"></div>
                </div>
            </div>

            <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
                <button onclick="downloadExcel()" class="bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition flex items-center justify-center gap-2">
                    <span>📊</span> Download Excel (.xlsx)
                </button>
                <button onclick="window.print()" class="bg-slate-800 text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition flex items-center justify-center gap-2">
                    <span>PDF</span> Cetak / Simpan PDF
                </button>
            </div>
        </div>
    </div>

    <script>

            ["Saya ingin tampil menarik dan menakjubkan", "Saya ingin menjadi orang yang sangat berhasil"],
            ["Saya ingin sesuai dan diterima dalam kelompok", "Saya suka membantu orang dalam mengambil sikap"],
            ["Saya cemas bila seseorang tidak menyukai saya", "Saya suka orang memperhatikan saya"],
            ["Saya suka mencoba hal-hal baru", "Saya lebih suka bekerja bersama orang lain daripada sendiri"],
            ["Saya kadang-kadang menyalahkan orang lain jika terjadi kesalahan", "Saya merasa terganggu jika ada yang tidak menyukai saya"],
            ["Saya suka mendukung pendapat atasan saya", "Saya suka mencoba pekerjaan-pekerjaan yang baru dan berbeda"],
            ["Saya menyukai petunjuk terperinci dalam menyelesaikan pekerjaan", "Saya suka memberitahu bila orang membuat saya kesal"],
            ["Saya selalu berusaha keras", "Saya suka melaksanakan setiap langkah dengan hati-hati"],
            ["Saya seorang pemimpin yang baik", "Saya dapat mengorganisir suatu pekerjaan dengan baik"],
            ["Saya mudah tersinggung", "Saya lambat dalam membuat keputusan"],
            ["Dalam satu kelompok saya lebih suka diam", "Saya suka mengerjakan beberapa pekerjaan sekaligus"],
            ["Saya sangat suka bila saya diundang", "Saya ingin lebih baik dari yang lain dalam mengerjakan sesuatu"],
            ["Saya suka membina hubungan yang akrab dengan teman-teman saya", "Saya suka menasehati orang lain"],

            ["Saya mengambil keputusan secara mudah dan cepat", "Saya menyimpan barang-barang saya secara rapih dan teratur"],
            ["Biasanya saya bekerja dengan tergesa-gesa", "Saya jarang marah atau sedih"],
            ["Saya ingin menjadi bagian dari kelompok", "Saya hanya ingin melakukan satu pekerjaan pada satu saat"],
            ["Saya berusaha membina persahabatan yang akrab", "Saya berusaha keras menjadi yang terbaik"],
            ["Saya suka mode terbaru untuk pakaian atau mobil", "Saya suka bertanggung jawab untuk kepentingan orang lain"],
            ["Saya menyukai perdebatan", "Saya suka mendapatkan perhatian"],
            ["Saya suka mendukung orang-orang yang menjadi atasan saya", "Saya tertarik menjadi bagian dari kelompok"],
            ["Saya suka mengikuti peraturan dengan hati-hati", "Saya suka orang mengenal saya dengan baik"],
            ["Saya selalu berusaha keras", "Saya seorang yang bersahabat"],
            ["Orang menilai saya seorang pemimpin yang baik", "Saya berpikir panjang dan berhati-hati"],
            ["Saya sering mengambil resiko / coba-coba", "Saya senang mengurus hal-hal kecil / detail"],
            ["Orang berpendapat bahwa saya bekerja cepat", "Saya berpendapat bahwa saya rapih dan teratur"],
            ["Saya senang mengikuti pertandingan dan berolah raga", "Saya mempunyai pribadi yang menyenangkan"],
            ["Saya senang jika orang dekat dan bersahabat dengan saya", "Saya selalu berusaha menyelesaikan sesuatu yang telah saya mulai"],
            ["Saya senang bereksperimen dan mencoba hal-hal baru", "Saya suka melaksanakan suatu pekerjaan sulit dengan baik"],
            ["Saya suka diperlakukan secara adil", "Saya suka memberitahu orang lain bagaimana melaksanakan sesuatu"],
            ["Saya suka melakukan apa yang diharapkan dari saya", "Saya suka memperoleh perhatian"],
            ["Saya suka petunjuk terperinci dalam melaksanakan suatu pekerjaan", "Saya suka berada diantara orang-orang banyak"],
            ["Saya selalu berusaha menyelesaikan pekerjaan secara sempurna", "Orang mengatakan bahwa saya tidak mengenal lelah"],
            ["Saya tipe pemimpin", "Saya mudah berteman"],
            ["Saya selalu berspekulasi", "Saya banyak sekali berpikir"],
            ["Saya bekerja dengan kecepatan yang teratur dan tetap", "Saya senang bekerja dengan hal-hal kecil / terperinci"],
            ["Saya bersemangat untuk mengikuti berbagai pertandingan dan berolah raga", "Saya suka mengatur dan menyimpan barang-barang secara rapih dan teratur"],
            ["Saya dapat bergaul secara baik dengan semua orang", "Saya adalah seorang yang mempunyai pembawaan tenang"],
            ["Saya ingin bertemu dengan orang-orang baru dan melakukan hal baru", "Saya selalu ingin menyelesaikan pekerjaan yang telah saya mulai"],
            ["Saya biasanya mempertahankan pendapat yang saya yakini", "Saya biasanya suka bekerja keras"],
            ["Saya suka saran-saran dari orang-orang yang saya kagumi", "Saya senang diserahi tanggung jawab atas sekelompok orang"],
            ["Saya biarkan diri saya banyak dipengaruhi oleh orang lain", "Saya suka jika mendapat banyak perhatian"],
            ["Saya berusaha bekerja keras", "Saya mengerjakan sesuatu dengan cepat"],
            ["Apabila saya bicara, kelompok mendengarkan", "Saya terampil menggunakan perkakas (alat-alat)"],
            ["Saya lambat dalam membina hubungan", "Saya lambat dalam membuat keputusan"],
            ["Saya biasanya makan secara cepat", "Saya suka membaca"],
            ["Saya suka pekerjaan dimana saya banyak bergerak", "Saya suka pekerjaan yang harus dilakukan dengan hati-hati"],
            ["Saya mencari teman sebanyak mungkin", "Apa yang telah saya simpan, akan mudah saya temukan lagi"],
            ["Saya merencanakan jauh-jauh sebelumnya", "Saya selalu menyenangkan"],
            ["Saya mempertahankan dengan bangga nama baik saya", "Saya terus menekuni suatu masalah sampai selesai"],
            ["Saya suka mendukung orang-orang yang saya kagumi", "Saya ingin sukses"],
            ["Saya suka orang lain yang memutuskan untuk kelompok", "Saya suka membuat keputusan untuk kelompok"],
            ["Saya selalu berusaha bekerja keras", "Saya mengambil keputusan secara cepat dan mudah"],
            ["Kelompok biasanya melakukan apa yang saya inginkan", "Saya biasa terburu-buru"],
            ["Saya sering merasa lelah", "Saya lamban dalam menentukan sikap"],
            ["Saya bekerja cepat", "Saya mudah berteman"],
            ["Saya biasanya mempunyai semangat dan tenaga", "Saya banyak menghabiskan waktu dengan berpikir"],
            ["Saya sangat ramah terhadap orang", "Saya suka pekerjaan yang memerlukan ketelitian"],
            ["Saya banyak berpikir dan merencana", "Saya menyimpan segala sesuatu pada tempatnya"],
            ["Saya suka pekerjaan yang harus memperhatikan hal-hal kecil (detail)", "Saya tidak mudah marah"],
            ["Saya suka mengikuti orang yang saya kagumi", "Saya selalu menyelesaikan pekerjaan yang telah saya mulai"],
            ["Saya suka petunjuk-petunjuk yang jelas", "Saya selalu bekerja keras"],
            ["Saya mengejar apa yang saya inginkan", "Saya seorang pemimpin yang baik"],
            ["Saya dapat membuat orang lain bekerja sesuai dengan yang saya inginkan", "Saya seorang yang tergolong santai tapi beruntung"],
            ["Saya mengambil keputusan secara mudah dan amat cepat", "Saya bicara dengan cepat"],
            ["Saya biasanya bekerja cepat", "Saya seorang pemimpin yang baik"],
            ["Saya tidak suka bertemu orang", "Saya cepat merasa lelah"],
            ["Saya mempunyai banyak sekali teman", "Saya banyak menghabiskan waktu dengan berpikir"],
            ["Saya suka bekerja dengan teori", "Saya suka bekerja dengan hal-hal yang terperinci"],
            ["Saya menikmati pekerjaan yang melibatkan hal-hal kecil (detail)", "Saya suka mengorganisir pekerjaan saya"],
            ["Saya menaruh barang pada tempatnya", "Saya selalu menyenangkan"],
            ["Saya suka diberitahu tentang apa yang saya perlu lakukan", "Saya harus menyelesaikan apa yang saya mulai"]
        ];

        const mappingPapi = [
            ['G', 'E'], ['A', 'N'], ['P', 'A'], ['X', 'P'], ['B', 'X'], ['O', 'B'], ['Z', 'O'], ['K', 'Z'], ['F', 'K'], ['W', 'F'],
            ['G', 'C'], ['L', 'E'], ['P', 'N'], ['X', 'A'], ['B', 'P'], ['O', 'X'], ['Z', 'B'], ['K', 'O'], ['F', 'Z'], ['W', 'K'],
            ['G', 'D'], ['L', 'C'], ['I', 'E'], ['X', 'N'], ['B', 'A'], ['O', 'P'], ['Z', 'X'], ['K', 'B'], ['F', 'O'], ['W', 'Z'],
            ['G', 'R'], ['L', 'D'], ['I', 'C'], ['T', 'E'], ['B', 'N'], ['O', 'A'], ['Z', 'P'], ['K', 'X'], ['F', 'B'], ['W', 'O'],
            ['G', 'S'], ['L', 'R'], ['I', 'D'], ['T', 'C'], ['V', 'E'], ['O', 'N'], ['Z', 'A'], ['K', 'P'], ['F', 'X'], ['W', 'B'],
            ['G', 'V'], ['L', 'S'], ['I', 'R'], ['T', 'D'], ['V', 'C'], ['S', 'E'], ['Z', 'N'], ['K', 'A'], ['F', 'P'], ['W', 'X'],
            ['G', 'T'], ['L', 'V'], ['I', 'S'], ['T', 'R'], ['V', 'D'], ['S', 'C'], ['R', 'E'], ['K', 'N'], ['F', 'A'], ['W', 'P'],
            ['G', 'I'], ['L', 'T'], ['I', 'V'], ['T', 'S'], ['V', 'R'], ['S', 'D'], ['R', 'C'], ['D', 'E'], ['F', 'N'], ['W', 'A'],
            ['G', 'L'], ['L', 'I'], ['I', 'T'], ['T', 'V'], ['V', 'S'], ['S', 'R'], ['R', 'D'], ['D', 'C'], ['C', 'E'], ['W', 'N']
        ];

        const form = document.getElementById('quiz-form');
        soalPapi.forEach((pair, i) => {
            const no = i + 1;
            form.innerHTML += `
                <div class="p-5 border-l-4 border-slate-300 bg-slate-50 rounded-r-xl shadow-sm">
                    <p class="font-bold text-indigo-500 mb-3 italic">No. ${no}</p>
                    <div class="grid grid-cols-1 gap-2">
                        <label class="flex items-center gap-3 cursor-pointer p-3 bg-white rounded-lg border hover:border-indigo-400">
                            <input type="radio" name="q${no}" value="A" class="w-4 h-4 text-indigo-600">
                            <span>A. ${pair[0]}</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer p-3 bg-white rounded-lg border hover:border-indigo-400">
                            <input type="radio" name="q${no}" value="B" class="w-4 h-4 text-indigo-600">
                            <span>B. ${pair[1]}</span>
                        </label>
                    </div>
                </div>
            `;
        });

        let currentScores = {};

        function kalkulasiHasil() {
            for(let i=1; i<=90; i++) {
                if(!document.querySelector(`input[name="q${i}"]:checked`)) {
                    alert('Lengkapi soal nomor ' + i);
                    return;
                }
            }

            let results = { G:0, L:0, I:0, T:0, V:0, S:0, R:0, D:0, C:0, E:0, N:0, A:0, P:0, X:0, B:0, O:0, Z:0, K:0, F:0, W:0 };

            for(let i=0; i<90; i++) {
                const choice = document.querySelector(`input[name="q${i+1}"]:checked`).value;
                if(choice === 'A') results[mappingPapi[i][0]]++;
                else results[mappingPapi[i][1]]++;
            }

            currentScores = results;
            renderHasil(results);
        }

        function renderHasil(scores) {
            document.getElementById('hasil-container').classList.remove('hidden');
            const box = document.getElementById('skor-box');
            box.innerHTML = '';
            Object.keys(scores).forEach(key => {
                box.innerHTML += `
                    <div class="p-3 border rounded-lg bg-indigo-50 shadow-inner">
                        <div class="text-[10px] font-bold text-indigo-400">${key}</div>
                        <div class="text-xl font-black text-indigo-800">${scores[key]}</div>
                    </div>`;
            });

            const ctx = document.getElementById('papiChart').getContext('2d');
            if(window.papiInstance) window.papiInstance.destroy();
            window.papiInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: Object.keys(scores),
                    datasets: [{
                        label: 'Skor Profil',
                        data: Object.values(scores),
                        backgroundColor: 'rgba(79, 70, 229, 0.25)',
                        borderColor: '#4f46e5',
                        borderWidth: 3
                    }]
                },
                options: { scales: { r: { min: 0, max: 9, ticks: { display: false } } } }
            });
            document.getElementById('hasil-container').scrollIntoView({ behavior: 'smooth' });
        }

        function downloadExcel() {
            const nama = document.getElementById('nama').value || 'Tanpa Nama';
            const nip = document.getElementById('nip').value || '-';
            const jabatan = document.getElementById('jabatan').value || '-';
            const tanggal = document.getElementById('tanggal').value || '-';

            // Data untuk Baris Atas (Identitas)
            const dataHeader = [
                ["HASIL TES PAPI KOSTICK DIGITAL"],
                [""],
                ["Nama", nama],
                ["NIP", nip],
                ["Jabatan", jabatan],
                ["Tanggal", tanggal],
                [""],
                ["ASPEK", "SKOR"]
            ];

            // Data Skor
            const dataSkor = Object.keys(currentScores).map(key => [key, currentScores[key]]);

            // Gabungkan Semua
            const finalData = [...dataHeader, ...dataSkor];

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(finalData);
            XLSX.utils.book_append_sheet(wb, ws, "Hasil Tes");
            
            // Simpan File
            XLSX.writeFile(wb, `Hasil_PAPI_${nama.replace(/ /g, '_')}.xlsx`);
        }

        document.getElementById('tanggal').valueAsDate = new Date();
    </script>
</body>
</html>
