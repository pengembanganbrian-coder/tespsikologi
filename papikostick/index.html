        // Kunci di bawah memetakan No Soal & Pilihan (A/B) ke Huruf Skor
        const scoringLogic = (no, pilihan, currentScores) => {
            // Logika disederhanakan: Horizontal (A) vs Diagonal (B)
            // Sesuai pola kotak pada lembar PAPI
            const mappingA = [
                null, 'G','L','I','T','V','S','R','D','C','E','G','L','I','T','V','S','R','D','C','E',
                'G','L','I','T','V','S','R','D','C','E','G','L','I','T','V','S','R','D','C','E',
                'G','L','I','T','V','S','R','D','C','E','G','L','I','T','V','S','R','D','C','E',
                'G','L','I','T','V','S','R','D','C','E','G','L','I','T','V','S','R','D','C','E',
                'G','L','I','T','V','S','R','D','C','E'
            ];
            const mappingB = [
                null, 'N','A','P','X','B','O','Z','K','F','W','N','A','P','X','B','O','Z','K','F','W',
                'N','A','P','X','B','O','Z','K','F','W','N','A','P','X','B','O','Z','K','F','W',
                'N','A','P','X','B','O','Z','K','F','W','N','A','P','X','B','O','Z','K','F','W',
                'N','A','P','X','B','O','Z','K','F','W','N','A','P','X','B','O','Z','K','F','W',
                'N','A','P','X','B','O','Z','K','F','W'
            ];

            let key = (pilihan === 'A') ? mappingA[no] : mappingB[no];
            if(key) currentScores[key]++;
        };

        // LOAD SOAL KE HTML
        const container = document.getElementById('soal-container');
        dataSoal.forEach((soal, index) => {
            const num = index + 1;
            const div = document.createElement('div');
            div.className = "p-4 border border-gray-100 rounded-lg hover:bg-blue-50 transition";
            div.innerHTML = `

        function prosesHasil() {
            let scores = { G:0, L:0, I:0, T:0, V:0, S:0, R:0, D:0, C:0, E:0, N:0, A:0, P:0, X:0, B:0, O:0, Z:0, K:0, F:0, W:0 };
            
            // Validasi kelengkapan
            for(let i=1; i<=90; i++) {
                const checked = document.querySelector(`input[name="q${i}"]:checked`);
                if(!checked) {
                    alert("Harap selesaikan soal nomor " + i);
                    checked.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                scoringLogic(i, checked.value, scores);
            }

            // Tampilkan Hasil
            document.getElementById('hasil-section').classList.remove('hidden');
            renderChart(scores);
            renderSummary(scores);
            document.getElementById('hasil-section').scrollIntoView({ behavior: 'smooth' });
        }

        function renderSummary(scores) {
            const container = document.getElementById('ringkasan-skor');
            container.innerHTML = "";
            for (const [key, val] of Object.entries(scores)) {
                container.innerHTML += `
                    <div class="bg-white border p-3 rounded text-center shadow-sm">
                        <div class="text-xs text-gray-400 font-bold">${key}</div>
                        <div class="text-xl font-bold text-blue-600">${val}</div>
                    </div>
                `;
            }
        }

        function renderChart(scores) {
            const ctx = document.getElementById('papiChart').getContext('2d');
            const labels = Object.keys(scores);
            const values = Object.values(scores);

            if(window.myRadar) window.myRadar.destroy();

            window.myRadar = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Profil PAPI Kostick',
                        data: values,
                        fill: true,
                        backgroundColor: 'rgba(37, 99, 235, 0.2)',
                        borderColor: 'rgb(37, 99, 235)',
                        pointBackgroundColor: 'rgb(220, 38, 38)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(255, 99, 132)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { display: true },
                            suggestedMin: 0,
                            suggestedMax: 9,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });
        }
