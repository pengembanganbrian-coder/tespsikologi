<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Assessment - DJBC 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #f1f5f9;
            --primary: #1e3a8a;
            --primary-light: #dbeafe;
            --accent: #b45309;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --success: #10b981;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        .subtitle { color: var(--accent); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-top: 5px; }

        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--primary-light);
            border-radius: 10px;
            margin: 20px 0 40px 0;
            overflow: hidden;
            display: none;
        }

        #progressBar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .step { display: none; animation: fadeIn 0.5s ease; }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); }

        .question-number { color: var(--primary); font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .question-text { font-size: 1.25rem; font-weight: 600; line-height: 1.4; margin-bottom: 30px; }

        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item {
            padding: 16px 20px;
            background: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .option-item:hover { background: var(--primary-light); border-color: var(--primary); }
        .option-item.selected { background: var(--primary); border-color: var(--primary); color: white; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 15px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-prev { background: #e2e8f0; color: var(--text-muted); }
        .btn-next { background: var(--primary); color: white; flex-grow: 1; }
        .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }

        .score-card {
            padding: 15px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tag {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        /* Interpretasi Colors */
        .cat-normal { background: #00FF00; color: #000; } /* Hijau Terang sesuai gambar */
        .cat-ringan { background: #fef9c3; color: #854d0e; }
        .cat-sedang { background: #ffedd5; color: #9a3412; }
        .cat-berat { background: #fee2e2; color: #991b1b; }
        .cat-sangat-berat { background: #450a0a; color: white; }

        #loadingOverlay {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .no-print { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <header>
        <h1>DASS-21 Assessment</h1>
        <div class="subtitle">Dukungan Kesehatan Mental DJBC 2026</div>
    </header>

    <div class="progress-container" id="progressWrapper">
        <div id="progressBar"></div>
    </div>

    <div id="step-identity" class="step active">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="userName" placeholder="Contoh: Budi Santoso">
        </div>
        <div class="form-group">
            <label>NIP</label>
            <input type="text" id="userNIP" placeholder="Masukkan 18 digit NIP">
        </div>
        <div class="form-group">
            <label>Unit Kerja / Jabatan</label>
            <input type="text" id="userJabatan" placeholder="Contoh: KPU Bea Cukai Tanjung Priok">
        </div>
        <button class="btn btn-next" onclick="startQuiz()" style="width: 100%;">Mulai Tes</button>
    </div>

    <div id="quiz-container"></div>

    <div id="loadingOverlay">
        <p>Mohon tunggu, sedang menyimpan hasil...</p>
    </div>

    <div id="step-result" class="step">
        <div id="pdfContent">
            <h2 style="text-align: center; margin-bottom: 5px;">Hasil Pemeriksaan DASS-21</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.8rem;">Laporan Rahasia Internal DJBC 2026</p>
            
            <div id="userInfoDisplay" style="background: #f8fafc; padding: 20px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 25px; font-size: 0.9rem; line-height: 1.6;"></div>
            
            <h3 style="font-size: 1rem; border-bottom: 2px solid #eee; padding-bottom: 5px;">ASPEK</h3>
            <div id="resultCards"></div>
            
            <div id="kesimpulanBox"></div>
            
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 30px; text-align: right;">
                © Copyright Tim Dukungan Kesehatan Mental DJBC 2026
            </p>
        </div>

        <div class="no-print">
            <button class="btn btn-next" onclick="downloadPDF()" style="background: var(--success);">Unduh Hasil (PDF)</button>
            <button class="btn btn-prev" onclick="location.reload()">Ulangi Tes</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw8XYUWgDlKyGBU1D7BDqoFTD3Mzfbx1lwuTpKySB5DJEaYQdNFfTAk0v9bUyDhUSf0PQ/exec';
    
    const questions = [
        "Saya merasa sulit untuk bersantai", "Saya merasa mulut saya sering kering", "Saya sama sekali tidak dapat merasakan perasaan positif",
        "Saya mengalami kesulitan bernafas (terengah-engah tanpa aktivitas fisik)", "Saya sepertinya tidak kuat lagi untuk melakukan suatu kegiatan",
        "Saya cenderung bereaksi berlebihan terhadap suatu situasi", "Saya merasa gemetar (misalnya: pada tangan)",
        "Saya merasa telah menghabiskan banyak energi disaat merasa cemas", "Saya merasa khawatir dengan situasi dimana saya mungkin menjadi panik",
        "Saya merasa tidak ada hal yang dapat diharapkan di masa depan", "Saya mendapati diri saya gelisah", "Saya merasa sulit untuk tenang",
        "Saya merasa sedih dan tertekan", "Saya sulit untuk sabar dalam menghadapi gangguan", "Saya merasa saya hampir panik",
        "Saya tidak merasa antusias dalam hal apapun", "Saya merasa bahwa saya tidak berharga sebagai seorang manusia",
        "Saya merasa bahwa saya mudah tersinggung", "Saya menyadari perubahan detak jantung tanpa aktivitas fisik",
        "Saya merasa takut tanpa alasan yang jelas", "Saya merasa bahwa hidup tidak bermanfaat"
    ];

    const mapping = ["S", "A", "D", "A", "D", "S", "A", "S", "A", "D", "S", "S", "D", "S", "A", "D", "D", "S", "A", "A", "D"];
    const labels = ["Tidak Pernah", "Kadang-kadang", "Cukup Sering", "Sangat Sering"];
    
    let currentStep = -1;
    let answers = new Array(questions.length).fill(null);

    function startQuiz() {
        if(!document.getElementById('userName').value || !document.getElementById('userNIP').value) {
            alert("Mohon lengkapi identitas.");
            return;
        }
        document.getElementById('step-identity').classList.remove('active');
        document.getElementById('progressWrapper').style.display = 'block';
        currentStep = 0;
        renderQuestion();
    }

    function renderQuestion() {
        const container = document.getElementById('quiz-container');
        const progress = ((currentStep + 1) / questions.length) * 100;
        document.getElementById('progressBar').style.width = `${progress}%`;

        container.innerHTML = `
            <div class="step active">
                <span class="question-number">Pertanyaan ${currentStep + 1} dari ${questions.length}</span>
                <div class="question-text">${questions[currentStep]}</div>
                <div class="options-list">
                    ${labels.map((label, i) => `
                        <div class="option-item ${answers[currentStep] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                            ${label}
                        </div>
                    `).join('')}
                </div>
                <div class="nav-buttons">
                    <button class="btn btn-prev" onclick="prevStep()">Kembali</button>
                    ${currentStep === questions.length - 1 ? 
                        `<button class="btn btn-next" id="btnFinish" ${answers[currentStep] === null ? 'disabled' : ''} onclick="submitData()">Lihat Hasil</button>` : 
                        `<button class="btn btn-next" id="btnNext" ${answers[currentStep] === null ? 'disabled' : ''} onclick="nextStep()">Lanjut</button>`
                    }
                </div>
            </div>
        `;
    }

    function selectOption(val) {
        answers[currentStep] = val;
        renderQuestion();
        setTimeout(() => { if(currentStep < questions.length - 1) nextStep(); }, 300);
    }

    function nextStep() { currentStep++; renderQuestion(); }
    function prevStep() { 
        if(currentStep === 0) {
            currentStep = -1;
            document.getElementById('step-identity').classList.add('active');
            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('progressWrapper').style.display = 'none';
        } else {
            currentStep--; renderQuestion();
        }
    }

    function getInterpretation(score, type) {
        const data = {
            D: { name: "Depresi", levels: [{max:9, label:"Normal", class:"cat-normal"}, {max:13, label:"Ringan", class:"cat-ringan"}, {max:20, label:"Sedang", class:"cat-sedang"}, {max:27, label:"Berat", class:"cat-berat"}, {max:999, label:"Sangat Berat", class:"cat-sangat-berat"}]},
            A: { name: "Kecemasan", levels: [{max:7, label:"Normal", class:"cat-normal"}, {max:9, label:"Ringan", class:"cat-ringan"}, {max:14, label:"Sedang", class:"cat-sedang"}, {max:19, label:"Berat", class:"cat-berat"}, {max:999, label:"Sangat Berat", class:"cat-sangat-berat"}]},
            S: { name: "Stres", levels: [{max:14, label:"Normal", class:"cat-normal"}, {max:18, label:"Ringan", class:"cat-ringan"}, {max:25, label:"Sedang", class:"cat-sedang"}, {max:33, label:"Berat", class:"cat-berat"}, {max:999, label:"Sangat Berat", class:"cat-sangat-berat"}]}
        };
        const res = data[type].levels.find(l => score <= l.max);
        return { ...res, title: data[type].name };
    }

    async function submitData() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('loadingOverlay').style.display = 'block';

        let s = { D: 0, A: 0, S: 0 };
        answers.forEach((v, i) => s[mapping[i]] += v);

        const results = {
            nama: document.getElementById('userName').value,
            nip: document.getElementById('userNIP').value,
            jabatan: document.getElementById('userJabatan').value,
            skor_d: s.D * 2,
            skor_a: s.A * 2,
            skor_s: s.S * 2,
            inter_d: getInterpretation(s.D*2, "D").label,
            inter_a: getInterpretation(s.A*2, "A").label,
            inter_s: getInterpretation(s.S*2, "S").label
        };

        try {
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(results) });
        } catch (e) { console.log("Error", e); }

        showResults(results);
    }

    function showResults(res) {
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('progressWrapper').style.display = 'none';
        document.getElementById('step-result').classList.add('active');

        document.getElementById('userInfoDisplay').innerHTML = `
            <strong>NIP:</strong> ${res.nip}<br>
            <strong>Nama:</strong> ${res.nama}<br>
            <strong>Tanggal Tes:</strong> ${new Date().toLocaleDateString('id-ID')}
        `;

        const subs = [
            {id:'D', score: res.skor_d, label: res.inter_d},
            {id:'A', score: res.skor_a, label: res.inter_a},
            {id:'S', score: res.skor_s, label: res.inter_s}
        ];

        document.getElementById('resultCards').innerHTML = subs.map(sub => {
            const interp = getInterpretation(sub.score, sub.id);
            return `<div class="score-card">
                <div style="font-weight:600;">${interp.title}</div>
                <div style="flex-grow:1; text-align:center;">:</div>
                <div style="width: 60%;"><span class="tag ${interp.class}" style="display:block; text-align:center;">${interp.label}</span></div>
            </div>`;
        }).join('');

        let kesimpulanText = "";
        let isSangatBerat = (res.inter_d === "Sangat Berat" || res.inter_a === "Sangat Berat" || res.inter_s === "Sangat Berat");
        let isBerat = (res.inter_d === "Berat" || res.inter_a === "Berat" || res.inter_s === "Berat");
        let isNormal = (res.inter_d === "Normal" && res.inter_a === "Normal" && res.inter_s === "Normal");

        if (isSangatBerat) {
            kesimpulanText = "HASIL: Tingkat tekanan psikologis Anda berada pada kategori Sangat Berat. Segera konsultasikan kondisi Anda dengan profesional (Psikolog/Psikiater) atau Tim Dukungan Mental.";
        } else if (isBerat) {
            kesimpulanText = "HASIL: Anda mengalami indikasi tekanan emosional yang Berat. Kami menyarankan Anda untuk mengambil waktu istirahat dan berbicara dengan konselor internal.";
        } else if (isNormal) {
            kesimpulanText = "HASIL: Kondisi emosional Anda berada dalam rentang Normal. Tetap jaga keseimbangan pola hidup dan kesehatan mental Anda.";
        } else {
            kesimpulanText = "HASIL: Kondisi emosional Anda berada dalam rentang Ringan/Sedang. Lakukan manajemen stres secara mandiri atau berdiskusi dengan orang terpercaya.";
        }

        document.getElementById('kesimpulanBox').innerHTML = `
            <div style="margin-top: 20px; padding: 15px; border: 1.5px solid #1e3a8a; border-radius: 8px; font-weight: 600; font-size: 0.95rem; line-height: 1.5;">
                ${kesimpulanText}
            </div>
        `;
    }

    function downloadPDF() {
        const element = document.getElementById('pdfContent');
        const nip = document.getElementById('userNIP').value;
        const opt = {
            margin: 15,
            filename: `Hasil_DASS21_${nip}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
