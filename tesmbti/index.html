        /* Header Laporan */
        .report-header { text-align: center; border-bottom: 4px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .report-header h1 { margin: 0; color: var(--primary); font-size: 2.2rem; text-transform: uppercase; }
        
        .identity-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-size: 0.95rem; }
        
        /* Layout Soal */
        .mbti-row { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 15px; margin-bottom: 15px; }
        .mbti-option { background: #fff; padding: 18px; border-radius: 10px; cursor: pointer; border: 2px solid #e2e8f0; font-size: 0.9rem; text-align: center; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .mbti-option:hover { border-color: var(--primary); background: #f0f7ff; }
        .mbti-option.selected { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }
        .vs { align-self: center; text-align: center; font-weight: 800; color: #cbd5e1; }

        /* Area Hasil (Panjang & Detail) */
        #resultArea { display: none; }
        .type-banner { background: var(--primary); color: white; padding: 40px; text-align: center; border-radius: 12px; margin-bottom: 40px; }
        .type-code { font-size: 5rem; font-weight: 800; letter-spacing: 15px; margin: 0; }
        .type-name { font-size: 1.5rem; font-weight: 600; opacity: 0.9; text-transform: uppercase; }

        .section-title { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 40px; color: var(--primary); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; display: flex; align-items: center; }
        .section-title::before { content: ""; width: 8px; height: 24px; background: var(--accent); margin-right: 12px; border-radius: 2px; }
        
        .content-block { line-height: 1.8; color: #334155; font-size: 1.05rem; white-space: pre-line; padding: 15px 0; }
        .list-item { margin-bottom: 10px; display: flex; align-items: flex-start; }
        .list-item::before { content: "•"; color: var(--accent); font-weight: bold; margin-right: 10px; }

        .btn { width: 100%; padding: 20px; border-radius: 12px; font-weight: 800; cursor: pointer; border: none; font-size: 1.1rem; margin-top: 20px; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-print { background: #059669; color: white; }
        
        @media print { .no-print { display: none; } .container { box-shadow: none; padding: 0; } }

        { id: 47, L: "Fokus target", R: "Siap menyesuaikan", catL: "J", catR: "P" },
        { id: 44, L: "Sudah diputuskan", R: "Tetap terbuka", catL: "J", catR: "P" },
        { id: 40, L: "Pasti", R: "Tidak pasti", catL: "J", catR: "P" },
        { id: 33, L: "Last minute stress", R: "Last minute fun", catL: "J", catR: "P" },
        { id: 26, L: "Perubahan musuh", R: "Perubahan hidup", catL: "J", catR: "P" },
        { id: 24, L: "Direncanakan", R: "Sesuai situasi", catL: "J", catR: "P" },
        { id: 21, L: "Diatur dari awal", R: "Mengalir", catL: "J", catR: "P" },
        { id: 19, L: "Checklist panduan", R: "Checklist beban", catL: "J", catR: "P" },
        { id: 12, L: "Puas rencana jalan", R: "Puas adaptasi", catL: "J", catR: "P" },
        { id: 3, L: "Tata tertib", R: "Bebas", catL: "J", catR: "P" },
        { id: 1, L: "Teguh pendirian", R: "Bisa berubah", catL: "J", catR: "P" }
    ];

    const responses = {};
    const grid = document.getElementById('questionGrid');
    questions.forEach(q => {
        grid.innerHTML += `<div class="mbti-row">
            <div class="mbti-option" id="q${q.id}L" onclick="saveResp(${q.id}, 'L', '${q.catL}')">${q.L}</div>
            <div class="vs">VS</div>
            <div class="mbti-option" id="q${q.id}R" onclick="saveResp(${q.id}, 'R', '${q.catR}')">${q.R}</div>
        </div>`;
    });

    function saveResp(id, side, val) {
        document.getElementById(`q${id}L`).classList.remove('selected');
        document.getElementById(`q${id}R`).classList.remove('selected');
        document.getElementById(`q${id}${side}`).classList.add('selected');
        responses[id] = val;
    }

    function generateResult() {
        if (Object.keys(responses).length < 60) { alert("Harap jawab semua 60 pertanyaan."); return; }
        
        const s = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
        Object.values(responses).forEach(v => s[v]++);

        const type = (s.E >= s.I ? "E" : "I") + (s.S >= s.N ? "S" : "N") + (s.T >= s.F ? "T" : "F") + (s.J >= s.P ? "J" : "P");
        const data = mbtiLib[type];

        document.getElementById('quizSection').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';
        
        document.getElementById('resType').innerText = type;
        document.getElementById('resTitle').innerText = data.title;
        document.getElementById('resDesc').innerText = data.desc;
        document.getElementById('resDev').innerText = data.dev;
        document.getElementById('resJobs').innerText = data.jobs;
        document.getElementById('resPartner').innerText = data.partner;
        
        document.getElementById('outName').innerText = document.getElementById('userName').value;
        document.getElementById('outNIP').innerText = document.getElementById('userNIP').value;
        window.scrollTo(0,0);
    }
</script>
