<html lang="id">

    <style>
        @media print {
            .no-print { display: none; }

                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">NIP</label>
                    <input type="text" id="input-nip" class="w-full border p-2 rounded mt-1 shadow-sm focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">Jabatan</label>

                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600">No HP (WhatsApp)</label>

                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-600">Tanggal Tes</label>
                    <input type="date" id="input-tanggal" class="w-full border p-2 rounded mt-1 shadow-sm">
                </div>
            </div>
            <button id="start-btn" onclick="startTest()" class="mt-6 w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition flex justify-center items-center">
                <span>MULAI TES</span>

        </div>

        <div id="quiz-section" class="hidden no-print">
            <div class="bg-white p-8 rounded-xl shadow-md">

                </div>

                <div class="space-y-4">

                    <button id="btnB" onclick="handleChoice('B')" class="option-btn w-full text-left p-5 border-2 rounded-xl transition font-medium text-gray-700"></button>
                </div>
            </div>
        </div>

        <div id="result-section" class="hidden">

                    <p class="text-blue-600 font-bold tracking-widest uppercase">Myers-Briggs Type Indicator (MBTI)</p>

            "ESTP": { title: "Spontan", uraian: "Aktif, Enerjik, Cekatan, Sigap, Antusias, Fun.\nKomunikator, asertif, to the point, ceplas-ceplos, berkarisma.\nBaik dalam pemecahan masalah langsung di tempat.\nMudah beradaptasi, toleran. Tidak suka penjelasan panjang lebar.", saran: "Belajarlah memahami perasaan orang lain saat berbicara.\nBelajarlah sabar, tidak semua hal bisa dicapai dengan cepat.\nLuangkan waktu merenung dan merencanakan masa depan.\nCobalah mencatat pengamatan termasuk detailnya.", profesi: "Marketing, Sales, Polisi, Entrepreneur, Pialang Saham, Technical Support", pasangan: "ISFJ atau ISTJ" },
            "ESFP": { title: "Murah Hati", uraian: "Outgoing, easygoing, sangat sosial, ramah, hangat & menyenangkan.\nOptimis, ceria, suka menjadi perhatian.\nPunya interpersonal skill yang baik, murah hati, mudah simpatik.\nSangat baik dalam keadaan yang membutuhkan common sense dan tindakan cepat.", saran: "Jangan terburu-buru mengambil keputusan. Belajarlah fokus.\nJangan hanya ingin menyenangkan semua orang.\nBelajarlah menghadapi kritik dan konflik. Jangan lari.\nHati-hati dengan kecenderungan materialistis.", profesi: "Entertainer, Seniman, Marketing, Konselor, Designer, Tour Guide, Hospitality", pasangan: "ISTJ atau ISFJ" },
            "ENFP": { title: "Optimis", uraian: "Ramah, hangat, enerjik, optimis, antusias, fun.\nImaginatif, penuh ide, kreatif, inovatif.\nMampu beradaptasi dengan beragam situasi dan perubahan.\nPandai berkomunikasi & membawa suasana positif.", saran: "Belajarlah untuk fokus, disiplin, tegas dan konsisten.\nBelajarlah untuk menghadapi konflik dan kritik.\nPikirkan kebutuhan diri sendiri juga.\nBelajarlah mengelola keuangan.", profesi: "Konselor, Psikolog, Entertainer, Pengajar, Motivator, Presenter, Reporter, MC", pasangan: "INTJ atau INFJ" },
            "ENTP": { title: "Inovatif – Kreatif", uraian: "Gesit, kreatif, cerdik, logis, baik dalam banyak hal.\nBanyak bicara dan punya kemampuan debat yang baik.\nFleksibel. Punya banyak cara memecahkan tantangan.\nCenderung melakukan hal baru sebelum menyelesaikan yang lama.", saran: "Cobalah win-win solution. Jangan ingin menang sendiri.\nBelajarlah disiplin dan konsisten.\nHindari perdebatan tidak penting.\nSeimbangkan cara pandang agar tidak terlalu optimis berlebihan.", profesi: "Pengacara, Psikolog, Konsultan, Ilmuwan, Aktor, Marketing, Programmer, Fotografer", pasangan: "INFJ atau INTJ" },
            "ESTJ": { title: "Konservatif – Disiplin", uraian: "Praktis, realistis, berpegang pada fakta.\nSangat sistematis, prosedural dan terencana.\nDisiplin, on time dan pekerja keras.\nKonservatif dan cenderung kaku.\nSenang mengorganisir sesuatu.", saran: "Kurangi keinginan untuk mengontrol dan memaksa orang lain.\nBelajarlah mengontrol emosi dan amarah.\nCobalah introspeksi diri dan meluangkan waktu sejenak untuk merenung.\nBelajarlah lebih sabar dan low profile.", profesi: "Militer, Manajer, Polisi, Hakim, Pengacara, Guru, Sales, Auditor, Akuntan", pasangan: "ISTP atau INTP" },
            "ESFJ": { title: "Harmonis", uraian: "Hangat, banyak bicara, populer, suportif.\nMembutuhkan keseimbangan dan baik dalam menciptakan harmoni.\nSelalu melakukan sesuatu yang manis bagi orang lain.\nTeliti dan rajin merawat apa yang ia miliki.", saran: "Jangan mengorbankan diri hanya untuk menyenangkan orang lain.\nJangan mengukur harga diri hanya dari pujian orang lain.\nBelajarlah lebih tegas dan dewasa dalam menerima tanggung jawab.\nHadapi kritik dan konflik.", profesi: "Perencana Keuangan, Perawat, Guru, Konselor, Administratif, Hospitality", pasangan: "ISFP atau INFP" },
            "ENFJ": { title: "Meyakinkan", uraian: "Kreatif, imajinatif, peka, sensitive, loyal.\nPeduli pada perasaan orang lain dan ingin menyenangkan mereka.\nPandai bergaul, meyakinkan, ramah, populer.\nResponsif pada kritik dan pujian.", saran: "Jangan mengorbankan diri hanya untuk orang lain.\nJangan mudah kecewa jika orang lain tidak sesuai harapan Anda.\nBelajarlah tegas dalam mengambil keputusan.\nJangan bersikap terlalu keras terhadap diri sendiri.", profesi: "Konsultan, Psikolog, Pengajar, Marketing, HRD, Event Coordinator, Motivator", pasangan: "INFP atau ISFP" },
            "ENTJ": { title: "Pemimpin Alami", uraian: "Tegas, asertif, jujur terus terang, obyektif.\nDominan, kuat kemauannya, perfeksionis dan kompetitif.\nTangguh, disiplin, dan sangat menghargai komitmen.\nBerkarisma, mampu menggerakkan orang.", saran: "Belajarlah relaks. Tidak perlu selalu kompetitif.\nNyatakan perasaan Anda, itu bukan kelemahan.\nBelajarlah mengelola amarah.\nJangan terlalu arogan dan meremehkan orang lain.", profesi: "Entrepreneur, Pengacara, Hakim, Konsultan, Pemimpin Organisasi, Business analyst", pasangan: "INTP atau ISTP" }
        };

        let currentIdx = 0;
        let userAnswers = [];

        function startTest() {
            const nama = document.getElementById('input-nama').value;
            const hp = document.getElementById('input-hp').value;
            if(!nama || !hp) return alert("Harap isi Nama dan No HP terlebih dahulu!");
            
            document.getElementById('identity-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progress-text').innerText = `Soal ${currentIdx + 1} / 60`;
            document.getElementById('progress-bar').style.width = `${((currentIdx+1)/60)*100}%`;
            document.getElementById('btnA').innerText = q.a;
            document.getElementById('btnB').innerText = q.b;
        }

        function handleChoice(choice) {
            userAnswers[currentIdx] = choice;
            if(currentIdx < 59) {
                currentIdx++;
                renderQuestion();
            } else {
                finalize();
            }
        }

        async function finalize() {
            // Tampilkan layar loading / proses
            document.getElementById('quiz-section').innerHTML = '<div class="text-center py-10"><p class="text-xl font-bold">Sedang menyimpan data ke database...</p></div>';

            const pesertaData = {
                nama: document.getElementById('input-nama').value,
                nip: document.getElementById('input-nip').value || "-",
                jabatan: document.getElementById('input-jabatan').value || "-",
                no_hp: document.getElementById('input-hp').value,
                tanggal: document.getElementById('input-tanggal').value || new Date().toLocaleDateString()
            };

            // Hitung MBTI
            let s = {I:0, E:0, S:0, N:0, T:0, F:0, J:0, P:0};
            questions.forEach((q, i) => {
                let code = q.id + userAnswers[i];
                if(mapping[code]) s[mapping[code]]++;
            });
            let res = (s.I>=s.E?'I':'E')+(s.S>=s.N?'S':'N')+(s.T>=s.F?'T':'F')+(s.J>=s.P?'J':'P');

            // KIRIM KE SPREADSHEET (Hanya No, Nama, NIP, Jabatan, No HP)
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peserta: pesertaData, tipe: res })
                });
            } catch (err) {
                console.error("Gagal sinkronisasi spreadsheet:", err);
            }

            // Tampilkan Hasil di UI
            document.getElementById('res-nama').innerText = pesertaData.nama;
            document.getElementById('res-nip').innerText = pesertaData.nip;
            document.getElementById('res-jabatan').innerText = pesertaData.jabatan;
            document.getElementById('res-hp').innerText = pesertaData.no_hp;
            document.getElementById('res-tanggal').innerText = pesertaData.tanggal;

            const d = fullDetails[res];
            document.getElementById('res-code').innerText = res;
            document.getElementById('res-title').innerText = d.title;
            document.getElementById('res-uraian').innerText = d.uraian;
            document.getElementById('res-saran').innerText = d.saran;
            document.getElementById('res-profesi').innerText = d.profesi;
            document.getElementById('res-pasangan').innerText = d.pasangan;

            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
