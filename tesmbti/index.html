
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MBTI Internal</title>
<style>
  body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; }
  .card { max-width: 820px; margin: 24px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
  h1,h2 { margin:0 0 12px; }
  .row { display:flex; gap:16px; }
  .col { flex:1; }
  label { display:block; margin-bottom:6px; font-weight:600; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; }
  .q { margin:16px 0; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt { border:1px solid #ddd; border-radius:10px; padding:14px; cursor:pointer; background:#fafafa; }
  .opt.selected { border-color:#4f46e5; background:#eef2ff; }
  .actions { display:flex; justify-content:space-between; margin-top:16px; }
  button { padding:10px 16px; border-radius:10px; border:none; cursor:pointer; }
  .primary { background:#4f46e5; color:#fff; }
  .ghost { background:#e5e7eb; }
  .bar { height:8px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; background:#4f46e5; width:0%; }
  .result { font-size:28px; font-weight:800; }
  .muted { color:#6b7280; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  td,th { border:1px solid #e5e7eb; padding:8px; text-align:center; }
</style>
</head>
<body>

<div class="card" id="step-ident">
  <h1>Pemetaan Preferensi MBTI (Internal)</h1>
  <p class="muted">Untuk pemetaan internal, bukan diagnosis klinis.</p>
  <div class="row">
    <div class="col">
      <label>Nama</label>
      <input id="nama" />
    </div>
    <div class="col">
      <label>NIP</label>
      <input id="nip" />
    </div>
  </div>
  <div class="row">
    <div class="col">
      <label>Jabatan</label>
      <input id="jabatan" />
    </div>
    <div class="col">
      <label>Unit</label>
      <input id="unit" />
    </div>
  </div>
  <div class="actions">
    <div></div>
    <button class="primary" onclick="start()">Mulai Tes</button>
  </div>
</div>

<div class="card" id="step-test" style="display:none;">
  <div class="bar"><div id="prog"></div></div>
  <div class="q">
    <h2 id="qtitle"></h2>
    <div class="opts">
      <div class="opt" id="optA" onclick="pick('A')"></div>
      <div class="opt" id="optB" onclick="pick('B')"></div>
    </div>
  </div>
  <div class="actions">
    <button class="ghost" onclick="prev()">Kembali</button>
    <button class="primary" onclick="next()">Lanjut</button>
  </div>
</div>

<div class="card" id="step-result" style="display:none;">
  <h1>Hasil Anda</h1>
  <div class="result" id="type"></div>
  <table>
    <tr><th>E</th><th>I</th><th>S</th><th>N</th><th>T</th><th>F</th><th>J</th><th>P</th></tr>
    <tr id="scores"></tr>
  </table>
  <p class="muted" id="summary"></p>
</div>

<script>
// Demo items (extend to full 60)
const ITEMS = [
  { A:{t:'Menyimpan semangat dalam hati', d:'I'}, B:{t:'Mengekspresikan semangat', d:'E'} },
  { A:{t:'Beraktivitas sendirian di rumah menyenangkan', d:'I'}, B:{t:'Bertemu orang membuat bersemangat', d:'E'} },
  { A:{t:'Praktis', d:'S'}, B:{t:'Konseptual', d:'N'} },
  { A:{t:'Menggunakan pengalaman sebagai pedoman', d:'S'}, B:{t:'Menggunakan imajinasi sebagai pedoman', d:'N'} },
  { A:{t:'Mengambil keputusan berdasarkan logika', d:'T'}, B:{t:'Berdasarkan perasaan dan kondisi orang', d:'F'} },
  { A:{t:'Standar harus ditegakkan', d:'T'}, B:{t:'Perasaan manusia lebih penting', d:'F'} },
  { A:{t:'Terencana dan memiliki deadline', d:'J'}, B:{t:'Spontan dan fleksibel', d:'P'} },
  { A:{t:'Aturan dan jadwal membantu', d:'J'}, B:{t:'Aturan dan jadwal membebani', d:'P'} }
];

let i=0;
let answers = Array(ITEMS.length).fill(null);
let score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

function start(){
  document.getElementById('step-ident').style.display='none';
  document.getElementById('step-test').style.display='block';
  render();
}

function render(){
  const it = ITEMS[i];
  document.getElementById('qtitle').innerText = `Pertanyaan ${i+1} dari ${ITEMS.length}`;
  const a = document.getElementById('optA');
  const b = document.getElementById('optB');
  a.innerText = it.A.t; b.innerText = it.B.t;
  a.classList.toggle('selected', answers[i]==='A');
  b.classList.toggle('selected', answers[i]==='B');
  document.getElementById('prog').style.width = Math.round((i/ITEMS.length)*100)+'%';
}

function pick(x){ answers[i]=x; render(); }

function prev(){ if(i>0){ i--; render(); } }

function next(){
  if(!answers[i]){ alert('Pilih salah satu.'); return; }
  if(i<ITEMS.length-1){ i++; render(); }
  else finish();
}

function finish(){
  // reset
  score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  answers.forEach((a,idx)=>{
    const d = ITEMS[idx][a].d;
    score[d]++;
  });
  const type =
    (score.E>=score.I?'E':'I') +
    (score.S>=score.N?'S':'N') +
    (score.T>=score.F?'T':'F') +
    (score.J>=score.P?'J':'P');

  document.getElementById('step-test').style.display='none';
  document.getElementById('step-result').style.display='block';
  document.getElementById('type').innerText = type;
  document.getElementById('scores').innerHTML =
    `<td>${score.E}</td><td>${score.I}</td><td>${score.S}</td><td>${score.N}</td><td>${score.T}</td><td>${score.F}</td><td>${score.J}</td><td>${score.P}</td>`;
  document.getElementById('summary').innerText =
    'Hasil ini menggambarkan preferensi kerja dan komunikasi untuk pemetaan internal.';
}
</script>
</body>
</html>
