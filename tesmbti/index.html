<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Asesmen MBTI DJBC 2026</title>
    <style>
        :root { --navy: #1a237e; --gold: #ffd600; --soft: #f4f6f9; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--soft); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: var(--navy); color: white; padding: 30px; text-align: center; border-bottom: 6px solid var(--gold); }
        .content { padding: 40px; }
        .id-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: #f9f9f9; padding: 25px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #eee; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 13px; color: var(--navy); }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: #f1f3f5; padding: 15px; border: 1px solid #dee2e6; text-align: center; color: var(--navy); }
        td { border: 1px solid #dee2e6; padding: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f8f9fa; }
        .selected { background: #e3f2fd !important; font-weight: bold; border-left: 6px solid var(--navy) !important; }
        
        .btn { background: var(--navy); color: white; padding: 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(26,35,126,0.3); }
        .btn:hover { background: #0d1252; transform: translateY(-2px); }
        
        #loading { display: none; text-align: center; margin: 20px 0; font-weight: bold; color: var(--navy); }
        #result-area { display: none; padding: 40px; }
        .result-card { background: var(--navy); color: white; padding: 40px; text-align: center; border-radius: 15px; margin-bottom: 30px; border-bottom: 8px solid var(--gold); }
        .result-desc { line-height: 1.8; text-align: justify; background: white; padding: 25px; border-radius: 10px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <div class="header">
            <h1 style="margin:0; letter-spacing: 2px;">E-ASSESSMENT MBTI</h1>
            <p style="margin:10px 0 0; opacity:0.9;">Pengembangan Kompetensi Pegawai DJBC - Versi 2026</p>
        </div>

        <div class="content">
            <div class="id-grid">
                <div><label>NAMA LENGKAP</label><input type="text" id="nama" placeholder="Sesuai KTP/SIPP"></div>
                <div><label>NIP</label><input type="text" id="nip" placeholder="18 Digit"></div>
                <div><label>JABATAN</label><input type="text" id="jabatan" placeholder="Pelaksana/Pemeriksa/Dsb"></div>
                <div><label>TANGGAL TES</label><input type="text" id="tgl" value="29/01/2026" readonly></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="50">NO</th>
                        <th>PILIHAN A</th>
                        <th>PILIHAN B</th>
                    </tr>
                </thead>
                <tbody id="quiz-body"></tbody>
            </table>

            <div id="loading">🚀 Sedang mengirim data ke Spreadsheet & Menganalisis...</div>
            <button class="btn" id="submitBtn" onclick="submitTest()">KIRIM JAWABAN & TAMPILKAN HASIL</button>
        </div>
    </div>

    <div id="result-area">
        <div class="result-card">
            <h3 style="margin:0; opacity:0.8;">PROFIL KEPRIBADIAN ANDA:</h3>
            <h1 id="out-type" style="font-size: 80px; margin: 15px 0; letter-spacing: 15px; color: var(--gold);">----</h1>
            <p id="out-nick" style="font-size: 20px; font-weight: bold;"></p>
        </div>
        <div class="result-desc">
            <h3 style="color: var(--navy); border-bottom: 2px solid var(--gold); display: inline-block;">Analisis Perilaku:</h3>
            <p id="out-detail"></p>
            <p style="color: #666; font-style: italic; font-size: 13px; margin-top: 30px;">*Data ini telah sinkron secara otomatis dengan file MBTI Pengembangan 2026 (Jawaban).</p>
        </div>
        <button class="btn" style="background: #444; margin-top: 30px;" onclick="window.print()">CETAK SEBAGAI PDF</button>
    </div>
</div>

<script>
    // 1. TEMPEL URL WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyBi6Na5vV-j6jZT04ssOCMvYJP7dXb4-pzw5I5SGuJIVHgQ1M3c2CBgb330lkJ1bKBBQ/exec';
    
    // 2. DATA 60 PERTANYAAN LENGKAP
    const questions = [
        {a:"Lebih memilih berkomunikasi dengan menulis.", b:"Lebih memilih berkomunikasi dengan berbicara."},
        {a:"Menemukan dan mengembangkan ide dengan merenungkan.", b:"Menemukan dan mengembangkan ide dengan mendiskusikan."},
        {a:"Berorientasi pada dunia internal (memori, pemikiran, ide).", b:"Berorientasi pada dunia eksternal (kegiatan, orang, aktifitas)."},
        {a:"Fokus pada beberapa ketertarikan mendalam.", b:"Fokus pada banyak ketertarikan meluas."},
        {a:"Tertutup dan mandiri.", b:"Sosial dan ekspresif."},
        {a:"Pertemuan dengan orang lain adalah melelahkan.", b:"Bertemu orang membuat bersemangat."},
        {a:"Beraktivitas sendirian di rumah menyenangkan.", b:"Beraktivitas sendirian di rumah membosankan."},
        {a:"Berinisiataif bila situasi memaksa.", b:"Berinisiatif tinggi dalam berbagai hal."},
        {a:"Memilih tempat tenang dan pribadi.", b:"Memilih tempat ramai dan banyak interaksi."},
        {a:"Berpikir matang sebelum bertindak.", b:"Bicara spontan sambil berpikir."},
        {a:"Menyimpan perasaan untuk diri sendiri.", b:"Mengekspresikan semangat."},
        {a:"Lebih banyak mendengarkan.", b:"Mencari kesempatan berkomunikasi perorangan."},
        {a:"Butuh waktu berpikir sebelum menjawab.", b:"Komunikasi langsung lebih disukai."},
        {a:"Tenang dan sulit ditebak.", b:"Membangun ide saat berbicara."},
        {a:"Memahami dunia melalui diri sendiri.", b:"Spontan, easy going, fleksibel."},
        {a:"Fokus pada fakta, detail, dan data nyata.", b:"Bergerak dari gambaran umum ke detail."},
        {a:"Menghargai pengalaman yang terbukti.", b:"Berbicara visi masa depan dan konsep."},
        {a:"Orang yang praktis dan realistis.", b:"Menggunakan imajinasi sebagai pedoman."},
        {a:"Berpikir linear dan bertahap.", b:"SOP sangat membantu."},
        {a:"Tertarik pada kegunaan praktis saat ini.", b:"Bebas dan dinamis."},
        {a:"Suka ketelitian dan instruksi jelas.", b:"Fakta lebih penting dari ide inspiratif."},
        {a:"Deskriptif dan spesifik.", b:"Perubahan dan variasi diutamakan."},
        {a:"Percaya pada panca indera.", b:"Bertindak step by step."},
        {a:"Suka mengulangi keahlian yang dikuasai.", b:"Menarik kesimpulan lama dan hati-hati."},
        {a:"Hidup untuk masa kini.", b:"Memahami teori saat mempraktekannya."},
        {a:"Mengingat peristiwa secara detail.", b:"Berfokus pada masa depan."},
        {a:"Bekerja dengan langkah konsisten.", b:"Konsisten mengamati detail."},
        {a:"Memilih cara konvensional.", b:"Praktis."},
        {a:"Dikenal realistis.", b:"Menyukai tantangan keterampilan baru."},
        {a:"Melihat pohon di dalam hutan.", b:"Memilih cara unik dan baru."},
        {a:"Keputusan berdasarkan analisa logis.", b:"Obyektif."},
        {a:"Menghargai kebenaran dan keadilan.", b:"Diyakinkan dengan penjelasan masuk akal."},
        {a:"Cenderung kritis.", b:"Berorientasi pada manusia dan hubungan."},
        {a:"Memisahkan perasaan dari masalah.", b:"Keputusan berdasarkan logika dan aturan."},
        {a:"Berorientasi pada tugas (Task).", b:"Mengemukakan tujuan lebih dulu."},
        {a:"Menggunakan logika 'kepala'.", b:"Menghargai skill dan teknis."},
        {a:"Terlihat kaku dan dingin.", b:"Kaku pada peraturan itu kejam."},
        {a:"Mampu berkata 'Tidak' jika benar.", b:"Yang penting harmonis terjaga."},
        {a:"Aturan harus ditegakkan konsisten.", b:"Mengakomodasi."},
        {a:"Menghargai kompetensi.", b:"Bersemangat menolong orang."},
        {a:"Mudah melihat kesalahan.", b:"Standar harus ditegakkan di atas segalanya."},
        {a:"Menganalisa kelemahan rencana.", b:"Menuntut perlakuan adil pada semua orang."},
        {a:"Menuntut pembuktian masuk akal.", b:"Mementingkan nilai personal."},
        {a:"Percaya argumen kuat.", b:"Sering dianggap keras kepala."},
        {a:"Ingin sukses dalam tugas.", b:"Menganalisa."},
        {a:"Jadwal sangat membantu.", b:"Spontan, fleksibel, tidak diikat waktu."},
        {a:"Berorientasi pada hasil akhir.", b:"Perubahan mendadak tidak masalah."},
        {a:"Fokus pada target dan deadline.", b:"Aturan dan jadwal memperjelas tindakan."},
        {a:"Tenang bila keputusan sudah diambil.", b:"Berorientasi pada hasil."},
        {a:"Ketidakpastian membuat bingung.", b:"Siap menyesuaikan diri."},
        {a:"Situasi 'last minute' menyiksa.", b:"Nyaman bila situasi tetap terbuka."},
        {a:"Perubahan adalah gangguan.", b:"Ketidakpastian itu seru dan fun."},
        {a:"Bertindak sesuai rencana matang.", b:"Last minute memunculkan potensi."},
        {a:"Hidup harus teratur.", b:"Perubahan adalah semangat hidup."},
        {a:"Checklist adalah panduan penting.", b:"Bertindak sesuai kondisi saat itu."},
        {a:"Puas menjalankan rencana.", b:"Hidup mengalir sesuai kondisi."},
        {a:"Mengatur orang dengan tata tertib.", b:"Daftar panduan sangat penting."},
        {a:"Berpegang teguh pada pendirian.", b:"Puas beradaptasi dengan momentum."},
        {a:"Bekerja sistematis.", b:"Membiarkan orang lain bebas bertindak."},
        {a:"Menutup pilihan agar tugas selesai.", b:"Berpegang teguh pada pendirian."}
    ];

    const tbody = document.getElementById('quiz-body');
    questions.forEach((q, i) => {
        tbody.innerHTML += `
            <tr id="row-${i}">
                <td align="center"><b>${i+1}</b></td>
                <td id="opt-${i}a" onclick="select(${i},'a')"><input type="radio" name="r${i}" value="A"> ${q.a}</td>
                <td id="opt-${i}b" onclick="select(${i},'b')"><input type="radio" name="r${i}" value="B"> ${q.b}</td>
            </tr>
        `;
    });

    function select(idx, opt) {
        document.querySelectorAll(`#row-${idx} input`)[opt === 'a' ? 0 : 1].checked = true;
        document.getElementById(`opt-${idx}a`).className = (opt === 'a' ? 'selected' : '');
        document.getElementById(`opt-${idx}b`).className = (opt === 'b' ? 'selected' : '');
    }

    async function submitTest() {
        const answers = [];
        for(let i=0; i<60; i++) {
            let sel = document.querySelector(`input[name="r${i}"]:checked`);
            if(!sel) {
                alert("Nomor " + (i+1) + " belum dijawab!");
                document.getElementById(`row-${i}`).scrollIntoView({ behavior: 'smooth' });
                return;
            }
            // Mengirim teks lengkap agar dikenali rumus Spreadsheet
            answers.push(sel.parentElement.innerText.trim());
        }

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        const payload = {
            nama: document.getElementById('nama').value,
            nip: document.getElementById('nip').value,
            jabatan: document.getElementById('jabatan').value,
            tanggal: document.getElementById('tgl').value,
            jawaban: answers
        };

        try {
            const response = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            
            // Tampilan Laporan Akhir
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('out-type').innerText = result.mbti; 
            document.getElementById('out-nick').innerText = "Tipe Kepribadian Berdasarkan Analisis Kerja";
            document.getElementById('out-detail').innerText = "Hasil analisis menunjukkan kecenderungan tipe " + result.mbti + ". Data Anda telah terekam di pusat data pengembangan pegawai.";
            window.scrollTo(0,0);
        } catch (e) {
            alert("Terjadi kesalahan, namun data mungkin tetap tersimpan. Silakan cek Spreadsheet!");
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
