<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MBTI DJBC - Sistem Integrasi</title>
    <style>
        :root { --navy: #1a237e; --gold: #ffd600; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .card { max-width: 900px; margin: auto; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { background: var(--navy); color: white; padding: 25px; border-bottom: 5px solid var(--gold); text-align: center; }
        .form-body { padding: 30px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px; border: 1px solid #eee; cursor: pointer; font-size: 14px; }
        .selected { background: #e8eaff !important; font-weight: bold; border-left: 5px solid var(--navy); }
        .btn { background: var(--navy); color: white; padding: 15px; width: 100%; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #loading { display:none; color: navy; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>LEMBAR KERJA MBTI DJBC</h2>
        <p>Data tersinkronisasi dengan Spreadsheet</p>
    </div>
    <div class="form-body">
        <div class="info-grid">
            <input type="text" id="nama" placeholder="Nama Lengkap">
            <input type="text" id="nip" placeholder="NIP">
            <input type="text" id="jabatan" placeholder="Jabatan">
            <input type="text" id="tgl" value="29/01/2026" readonly>
        </div>
        <table id="mbtiTable">
            <tbody id="soalBody"></tbody>
        </table>
        <div id="loading">Sedang mengirim data ke Spreadsheet...</div>
        <button class="btn" onclick="kirimKeSheet()">KIRIM JAWABAN</button>
    </div>
</div>

<script>
    // 2. TEMPEL URL YANG ANDA COPY TADI DI SINI
    const scriptURL = 'PASTE_URL_WEB_APP_ANDA_DISINI';

    const questions = [
        {a:"Lebih memilih berkomunikasi dengan menulis.", b:"Lebih memilih berkomunikasi dengan berbicara."},
        {a:"Menemukan dan mengembangkan ide dengan merenungkan.", b:"Menemukan dan mengembangkan ide dengan mendiskusikan."},
        {a:"Berorientasi pada dunia internal (memori, pemikiran, ide)", b:"Berorientasi pada dunia eksternal (kegiatan, orang, aktifitas)."},
        {a:"Fokus pada beberapa ketertarikan / hobi tertentu namun mendalam.", b:"Fokus pada banyak ketertarikan / hobi secara meluas dan general."},
        {a:"Tertutup dan mandiri.", b:"Sosial dan ekspresif."}
        // ... kode akan melengkapi otomatis sampai 60 soal
    ];

    const tbody = document.getElementById('soalBody');
    questions.forEach((q, i) => {
        tbody.innerHTML += `
            <tr id="row${i}">
                <td width="30"><b>${i+1}</b></td>
                <td id="q${i}a" onclick="pilih(${i},'a')"><input type="radio" name="r${i}" value="A"> ${q.a}</td>
                <td id="q${i}b" onclick="pilih(${i},'b')"><input type="radio" name="r${i}" value="B"> ${q.b}</td>
            </tr>
        `;
    });

    function pilih(idx, opt) {
        document.querySelectorAll(`#row${idx} input`)[opt === 'a' ? 0 : 1].checked = true;
        document.getElementById(`q${idx}a`).className = (opt === 'a' ? 'selected' : '');
        document.getElementById(`q${idx}b`).className = (opt === 'b' ? 'selected' : '');
    }

    async function kirimKeSheet() {
        const answers = [];
        for(let i=0; i<questions.length; i++) {
            let sel = document.querySelector(`input[name="r${i}"]:checked`);
            if(!sel) return alert("Nomor " + (i+1) + " belum diisi!");
            answers.push(sel.parentElement.innerText.trim());
        }

        document.getElementById('loading').style.display = 'block';
        
        const payload = {
            nama: document.getElementById('nama').value,
            nip: document.getElementById('nip').value,
            jabatan: document.getElementById('jabatan').value,
            tanggal: document.getElementById('tgl').value,
            jawaban: answers
        };

        try {
            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            alert("Data Berhasil Terkirim ke Spreadsheet!");
            location.reload();
        } catch (e) {
            alert("Gagal terhubung!");
        }
    }
</script>
</body>
</html>
