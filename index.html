<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tes Psikologi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px 20px; background-color: #f0f2f5; color: #333; }
        .container { background: white; padding: 40px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { color: #1a73e8; margin-bottom: 10px; font-size: 24px; }
        p { margin-bottom: 30px; color: #666; }
        .btn { 
            display: block; padding: 15px; margin: 15px 0;
            background-color: #1a73e8; color: white; 
            text-decoration: none; border-radius: 8px; 
            font-weight: bold; transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover { background-color: #1557b0; transform: translateY(-2px); }
        .btn-disc { background-color: #34a853; }
        .btn-disc:hover { background-color: #2d8e47; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selamat Datang</h1>
        <p>Silakan pilih jenis tes yang ingin kamu ikuti:</p>

        <a href="tesmbti/" class="btn">Mulai Tes MBTI</a>

        <a href="tesdisc/" class="btn btn-disc">Mulai Tes DISC</a>
    </div>
</body>
</html>
