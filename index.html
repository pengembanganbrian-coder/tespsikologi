<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen MBTI DJBC 2026</title>
    <style>
        :root { --navy: #1a237e; --gold: #ffd600; --soft: #f4f6f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--soft); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--navy); color: white; padding: 30px; text-align: center; border-bottom: 6px solid var(--gold); }
        .content { padding: 30px; }
        .id-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #eee; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eee; padding: 15px; border: 1px solid #ddd; color: var(--navy); }
        td { border: 1px solid #ddd; padding: 12px; font-size: 14px; cursor: pointer; }
        tr:hover { background: #f1f1f1; }
        .selected { background: #e3f2fd !important; font-weight: bold; border-left: 5px solid var(--navy) !important; }
        .btn { background: var(--navy); color: white; padding: 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; margin-top: 20px; }
        #result-area { display: none; padding: 40px; text-align: center; }
        .result-card { background: var(--navy); color: white; padding: 40px; border-radius: 15px; border-bottom: 8px solid var(--gold); }
        #loading { display: none; font-weight: bold; color: var(--navy); margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <div class="header">
            <h1 style="margin:0">E-MBTI ASSESSMENT DJBC</h1>
            <p style="margin:5px 0 0; opacity:0.8">Integrasi Spreadsheet Pengembangan Pegawai 2026</p>
        </div>

        <div class="content">
            <div class="id-grid">
                <div><label style="font-size:12px; font-weight:bold">NAMA LENGKAP</label><input type="text" id="nama" placeholder="Masukkan Nama"></div>
                <div><label style="font-size:12px; font-weight:bold">NIP</label><input type="text" id="nip" placeholder="Masukkan NIP"></div>
                <div><label style="font-size:12px; font-weight:bold">JABATAN</label><input type="text" id="jabatan" placeholder="Masukkan Jabatan"></div>
                <div><label style="font-size:12px; font-weight:bold">TANGGAL TES</label><input type="text" id="tgl" value="29/01/2026" readonly></div>
            </div>

            <table>
                <thead>
                    <tr><th width="50">NO</th><th>PERNYATAAN A</th><th>PERNYATAAN B</th></tr>
                </thead>
                <tbody id="quiz-body"></tbody>
            </table>

            <div id="loading">⏳ Sedang memproses data ke Spreadsheet...</div>
            <button class="btn" id="submitBtn" onclick="submitTest()">KIRIM JAWABAN & LIHAT HASIL</button>
        </div>
    </div>

    <div id="result-area">
        <div class="result-card">
            <h2>DATA BERHASIL TERSIMPAN!</h2>
            <p>Terima kasih, data Anda telah masuk ke Spreadsheet Pengembangan Pegawai.</p>
            <h1 style="font-size: 60px; letter-spacing: 10px; color: var(--gold);">✓</h1>
        </div>
        <button class="btn" style="background:#555" onclick="location.reload()">ISI KEMBALI</button>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'URL_WEB_APP_ANDA_DISINI';

    const questions = [
        {a:"Lebih memilih berkomunikasi dengan menulis.", b:"Lebih memilih berkomunikasi dengan berbicara."},
        {a:"Menemukan dan mengembangkan ide dengan merenungkan.", b:"Menemukan dan mengembangkan ide dengan mendiskusikan."},
        {a:"Berorientasi pada dunia internal (memori, pemikiran, ide).", b:"Berorientasi pada dunia eksternal (kegiatan, orang, aktifitas)."},
        {a:"Fokus pada banyak ketertarikan / hobi secara meluas dan general.", b:"Fokus pada beberapa ketertarikan / hobi tertentu namun mendalam."},
        {a:"Tertutup dan mandiri.", b:"Sosial dan ekspresif."},
        {a:"Pertemuan dengan orang lain dan aktivitas sosial adalah melelahkan.", b:"Bertemu orang dan aktivitas sosial membuat bersemangat."},
        {a:"Beraktivitas sendirian di rumah adalah menyenangkan.", b:"Beraktivitas sendirian di rumah adalah membosankan."},
        {a:"Berinisiataif bila situasi memaksa.", b:"Berinisiatif tinggi hampir dalam berbagai hal meski tidak berhubungan dengan dirinya."},
        {a:"Lebih memilih tempat yang tenang dan pribadi.", b:"Lebih memilih tempat yang ramai dan banyak interaksi / aktivitas."},
        {a:"Berpikir secara matang sebelum bertindak.", b:"Bicara secara spontan atau sambil berpikir saat berbicara."},
        {a:"Menyimpan perasaan untuk diri sendiri.", b:"Mengekspresikan semangat."},
        {a:"Lebih banyak mendengarkan daripada berbicara.", b:"Mencari kesempatan untuk berkomunikasi secara perorangan."},
        {a:"Membutuhkan waktu untuk berpikir sebelum menjawab atau bereaksi.", b:"Komunikasi yang dilakukan secara langsung lebih disukai (tatap muka)."},
        {a:"Tenang dan sulit ditebak.", b:"Membangun idenya justru pada saat berbicara."},
        {a:"Memahami dunia melalui diri sendiri.", b:"Spontan, easy going, fleksibel."},
        {a:"Fokus pada fakta, detail, dan data nyata apa adanya.", b:"Bergerak dari gambaran umum (big picture) baru kemudian menuju detail."},
        {a:"Menghargai pengalaman yang sudah terbukti.", b:"Berbicara mengenai visi masa depan dan konsep-konsep mengenai visi tersebut."},
        {a:"Orang yang praktis dan realistis.", b:"Menggunakan imajinasi dan perenungan sebagai pedoman."},
        {a:"Berpikir secara linear dan bertahap.", b:"SOP sangat membantu."},
        {a:"Tertarik pada kegunaan praktis saat ini.", b:"Bebas dan dinamis."},
        {a:"Suka mengerjakan tugas yang membutuhkan ketelitian dan instruksi yang jelas.", b:"Memilih fakta lebih penting daripada ide inspiratif."},
        {a:"Deskriptif dan spesifik saat menjelaskan sesuatu.", b:"Perubahan dan variasi lebih diutamakan."},
        {a:"Lebih percaya pada panca indera daripada intuisi.", b:"Bertindak step by step dengan timeframe yang jelas."},
        {a:"Suka mengulangi keahlian yang sudah dikuasai.", b:"Dalam menarik kesimpulan lama dan hati-hati."},
        {a:"Hidup untuk masa kini (enjoying the moment).", b:"Memahami ide dan teori saat mempraktekannya secara langsung."},
        {a:"Mengingat peristiwa secara detail sebagaimana adanya.", b:"Berfokus pada masa depan (apa yang mungkin bisa dicapai di masa mendatang)."},
        {a:"Bekerja dengan langkah yang konsisten.", b:"Secara konsisten mengamati dan mengingat detail."},
        {a:"Memilih cara yang konvensional.", b:"Praktis."},
        {a:"Dikenal sebagai orang yang realistis.", b:"Menyukai tantangan untuk menguasai keterampilan baru."},
        {a:"Melihat pohon di dalam hutan (fokus pada bagian-bagian kecil).", b:"Memilih cara yang unik dan belum dipraktekkan orang lain."},
        {a:"Keputusan berdasarkan analisa logis dan objektif.", b:"Obyektif."},
        {a:"Menghargai kebenaran dan keadilan di atas segalanya.", b:"Diyakinkan dengan penjelasan yang masuk akal."},
        {a:"Cenderung kritis dan mampu menemukan kelemahan secara cepat.", b:"Berorientasi pada manusia dan hubungan."},
        {a:"Memisahkan perasaan dari masalah saat mengambil keputusan.", b:"Mengambil keputusan berdasarkan logika dan aturan main."},
        {a:"Berorientasi pada tugas (Task oriented).", b:"Mengemukakan tujuan dan sasaran lebih dahulu."},
        {a:"Menggunakan logika 'kepala' daripada 'hati'.", b:"Menghargai seseorang karena skill dan faktor teknis."},
        {a:"Terlihat kaku dan dingin oleh orang lain.", b:"Terlalu kaku pada peraturan dan pekerjaan itu kejam."},
        {a:"Mampu berkata 'Tidak' jika merasa benar.", b:"Yang penting situasi harmonis terjaga."},
        {a:"Aturan harus ditegakkan secara konsisten.", b:"Mengakomodasi."},
        {a:"Menghargai kompetensi dan prestasi kerja.", b:"Bersemangat saat menolong orang keluar dari kesalahan dan meluruskan."},
        {a:"Mudah melihat kesalahan dan ketidakkonsistenan.", b:"Standar harus ditegakkan di atas segalanya."},
        {a:"Menganalisa kelemahan sebuah rencana.", b:"Menuntut perlakuan yang adil dan sama pada semua orang."},
        {a:"Menuntut pembuktian yang masuk akal.", b:"Mementingkan nilai-nilai personal."},
        {a:"Percaya pada argumen yang kuat daripada perasaan.", b:"Sering dianggap keras kepala."},
        {a:"Ingin sukses dalam menjalankan tugas.", b:"Menganalisa."},
        {a:"Jadwal dan struktur sangat membantu produktivitas.", b:"Spontan, fleksibel, tidak diikat waktu."},
        {a:"Berorientasi pada hasil akhir.", b:"Perubahan mendadak tidak menjadi masalah."},
        {a:"Fokus pada target dan deadline.", b:"Aturan, jadwal dan target akan sangat membantu."},
        {a:"Merasa tenang bila suatu keputusan sudah diambil.", b:"Berorientasi pada hasil."},
        {a:"Ketidakpastian membuat merasa tidak nyaman dan bingung.", b:"Memperhatikan hal-hal baru dan siap menyesuaikan diri."},
        {a:"Situasi 'last minute' adalah menyiksa.", b:"Merasa nyaman bila situasi tetap terbuka."},
        {a:"Perubahan adalah gangguan bagi rencana yang sudah dibuat.", b:"Ketidakpastian itu menegangkan, seru, dan membuat lebih fun."},
        {a:"Bertindak sesuai dengan rencana yang sudah matang.", b:"Situasi last minute membuat bersemangat."},
        {a:"Hidup harusnya teratur dan terencana.", b:"Perubahan adalah semangat hidup."},
        {a:"Daftar dan checklist adalah panduan penting.", b:"Bertindak sesuai situasi dan kondisi."},
        {a:"Kepuasan adalah ketika mampu menjalankan rencana.", b:"Hidup harusnya mengalir sesuai kondisi."},
        {a:"Mengatur orang lain dengan tata tertib.", b:"Daftar dan checklist adalah panduan penting."},
        {a:"Berpegang teguh pada pendirian.", b:"Kepuasan adalah beradaptasi dengan momentum."},
        {a:"Bekerja secara sistematis dan metodis.", b:"Membiarkan orang lain bertindak bebas."},
        {a:"Menutup pilihan-pilihan agar tugas segera selesai.", b:"Berpegang teguh pada pendirian."}
    ];

    const tbody = document.getElementById('quiz-body');
    questions.forEach((q, i) => {
        tbody.innerHTML += `
            <tr id="row-${i}">
                <td align="center"><b>${i+1}</b></td>
                <td id="q${i}a" onclick="pick(${i},'a')"><input type="radio" name="r${i}" value="A"> ${q.a}</td>
                <td id="q${i}b" onclick="pick(${i},'b')"><input type="radio" name="r${i}" value="B"> ${q.b}</td>
            </tr>
        `;
    });

    function pick(i, opt) {
        document.querySelectorAll(`#row-${i} input`)[opt === 'a' ? 0 : 1].checked = true;
        document.getElementById(`q${i}a`).className = (opt === 'a' ? 'selected' : '');
        document.getElementById(`q${i}b`).className = (opt === 'b' ? 'selected' : '');
    }

    async function submitTest() {
        const answers = [];
        for(let i=0; i<60; i++) {
            let sel = document.querySelector(`input[name="r${i}"]:checked`);
            if(!sel) {
                alert("Nomor " + (i+1) + " belum diisi!");
                document.getElementById(`row-${i}`).scrollIntoView();
                return;
            }
            answers.push(sel.parentElement.innerText.trim());
        }

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        const payload = {
            nama: document.getElementById('nama').value,
            nip: document.getElementById('nip').value,
            jabatan: document.getElementById('jabatan').value,
            tanggal: document.getElementById('tgl').value,
            jawaban: answers
        };

        try {
            await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload),
                mode: 'no-cors'
            });
            
            // Tampilan Sukses
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            window.scrollTo(0,0);
        } catch (e) {
            alert("Terjadi gangguan koneksi, silakan cek Spreadsheet.");
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
